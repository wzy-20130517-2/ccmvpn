name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带 Android SDK，不用额外 action（那个偶尔会 404）
      - name: 确认 SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME 2>/dev/null | head
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      # runner 预装的 gradle 是 9.x，AGP 8.x 用不了（Gradle 9.6 删了 AGP 依赖的内部 API）。
      # 直接下 8.13 的 wrapper，别用系统 gradle 生成 —— 生成时会用错版本。
      - name: Gradle wrapper
        run: |
          set -e
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar
          curl -fsSL -o gradlew \
            https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew
          chmod +x gradlew

      - name: Build
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ccmvpn-debug
          path: app/build/outputs/apk/debug/*.apk
